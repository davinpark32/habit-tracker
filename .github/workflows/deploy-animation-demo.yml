name: Deploy animation demo

on:
  push:
    branches: [august30-patch]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
      - uses: actions/checkout@v4
        with:
          path: demo-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-src/package-lock.json
      - name: Build main site
        working-directory: main-src
        run: npm ci && npm run build
      - name: Build animation demo
        working-directory: demo-src
        run: npm ci && npx vite build --base /habit-tracker/animation-demo/
      - name: Combine sites
        run: |
          mkdir -p site/animation-demo
          cp -R main-src/dist/. site/
          cp -R demo-src/dist/. site/animation-demo/
          cp site/animation-demo/index.html site/animation-demo/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
